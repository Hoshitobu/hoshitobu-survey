<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3559c7">
<meta name="referrer" content="no-referrer">
<title>過去問演習 — 星飛ぶの勉強部屋</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="kakomon/kakomon.css?v=20261104b">
<style>
  /* このページだけ：本文を広めにとる（採点と時計を左右に並べるため） */
  body { background: #f5f6fa; }
  main.kk-page { max-width: 1180px; padding-top: 22px; }
  .kk-title { margin: 4px 4px 18px; }
  .kk-title h2 { font-size: 22px; color: #141a2b; margin: 0 0 4px; letter-spacing: .01em; }
  .kk-title p { margin: 0; color: #5d6680; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>⭐ 共テ予想問題集 点数集計</h1>
    <div class="community">星飛ぶの勉強部屋</div>
  </div>
  <nav>
    <a href="index.html">回答する</a>
    <a href="results.html">集計を見る</a>
    <a href="kakomon.html" aria-current="page">過去問演習</a>
  </nav>
</header>
<main class="kk-page">
  <div class="kk-title">
    <h2>過去問演習</h2>
    <p>時間をはかって解き、自己採点すると、偏差値・順位と、どこで落としたかが出ます。過去問は全国と、予想問題集はこのサイトの利用者と比べます。</p>
  </div>
  <div id="kakomon"></div>
</main>
<script src="app-config.js"></script>
<script src="national-stats.js?v=20261104b"></script>
<script src="kakomon/kakomon-data.js?v=20261104b"></script>
<script src="kakomon/hoshitobu-link.js?v=20261104b"></script>
<script src="kakomon/kakomon-core.js?v=20261104b"></script>
<script>
// 公開サイト用の host：記録はこの端末のブラウザに保存、仲間の偏差値と予想問題集の比べる相手は「点数集計」から
(function () {
  const P = "kakomon.";
  const LINK = window.HoshitobuLink;
  LINK.addSchedulerLink();
  const ls = {
    get(k) { try { return localStorage.getItem(P + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(P + k, v); } catch (e) {} },
  };
  const read = id => { try { return JSON.parse(ls.get(id + ".history") || "[]"); } catch (e) { return []; } };
  const write = (id, h) => ls.set(id + ".history", JSON.stringify(h.slice(-100)));
  // 学力帯（点数集計と同じ）
  const BANDS = [["lt50", "〜50"], ["50_55", "50〜55"], ["55_60", "55〜60"], ["60_65", "60〜65"], ["65_70", "65〜70"], ["70up", "70以上"], ["unknown", "わからない"]];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

  // 点数集計に送れるのは、点数集計にある問題集・科目（数学ⅠA・ⅡBC の本試と予想問題集）
  const sendable = exam => exam.kind === "workbook" || (exam.year >= 2023);
  function rowsOf(exam, rec) {
    if (exam.kind === "workbook") {
      return [{subject: exam.part === "IA" ? "math1a" : "math2bc", book: exam.book, round: exam.round, score: Math.round(rec.total),
               sections: rec.per.filter(p => p.done).map(p => ({q: p.q, score: Math.round(p.got), max: Math.round(p.max)}))}];
    }
    return LINK.rowsFromKakomon(exam, rec);
  }

  const host = {
    kind: "public",
    peerLabel: "このサイトの利用者の中での偏差値",
    store: ls,
    loadHistory() { return Object.fromEntries((window.KAKOMON_EXAMS || []).map(e => [e.id, read(e.id)])); },
    historyFor: id => read(id),
    async saveRecord(exam, rec, extras) {
      const h = read(exam.id).filter(r => r.at !== rec.replaces);   // 同じ回を記録し直したときは上書き
      const {replaces, ...clean} = rec;
      h.push(clean); write(exam.id, h);
      let message = "";
      if (extras.toSurvey) {
        try {
          if (!extras.consent) throw new Error("同意にチェックを入れてください");
          if (!extras.band) throw new Error("学力帯を選んでください");
          const p = LINK.profile();
          LINK.saveProfile({band: extras.band, consent: true, code: LINK.CODE_RE.test(p.code) ? p.code : LINK.newCode()});
          const rows = await LINK.fitRows(rowsOf(exam, rec));
          await LINK.send(rows);
          message = `点数集計にも送りました（回答者コード ${LINK.profile().code}）。`;
          if (window.KAKOMON && window.KAKOMON.refreshWB) setTimeout(() => window.KAKOMON.refreshWB(), 300);
        } catch (err) {
          message = "点数集計には送れませんでした：" + (err && err.message ? err.message : err) + "。記録はこの端末に保存しました。";
        }
      }
      return {history: read(exam.id), message};
    },
    async deleteRecord(exam, at) { write(exam.id, read(exam.id).filter(r => r.at !== at)); return {history: read(exam.id)}; },
    async peers(exam) {
      const label = "このサイトの利用者の中での偏差値";
      if (!exam.survey) return {label, scores: null, empty: "この年度は集計の対象外です"};
      const r = await LINK.stats();
      const cell = (r.practice || []).find(c => c.subject === exam.survey.subject && c.book === exam.survey.book);
      // 3人未満の欄は集計側で隠される（ranking が null）
      const scores = cell && cell.ranking ? cell.ranking.map(x => +x.score).filter(x => isFinite(x)) : [];
      return {label, scores, minN: 10, fewText: n => n === 0 ? "集計はまだ3人未満" : `集計 ${n}人`};
    },
    saveOptions(exam) {
      if (!sendable(exam)) return "";
      const p = LINK.profile();
      return `<div class="kk-sendbox"><label class="kk-opt"><input type="checkbox" id="kk-tosurvey"${exam.kind === "workbook" ? " checked" : ""}>この点数を「点数集計」にも送る（匿名）</label>` +
        `<div class="kk-sendmore"><span>学力帯（直近の模試の偏差値）</span><select id="kk-band"><option value="">選んでください</option>` +
        BANDS.map(([id, label]) => `<option value="${id}"${p.band === id ? " selected" : ""}>${esc(label)}</option>`).join("") + `</select>` +
        `<label class="kk-opt" style="margin:0"><input type="checkbox" id="kk-consent"${p.consent ? " checked" : ""}>匿名で集計し、YouTube『星飛ぶ』の動画で使用することに同意する</label>` +
        `<span class="kk-faint">回答者コード：${p.code ? esc(p.code) : "初めて送るときに作ります"}（回答フォームと同じコード）</span></div></div>`;
    },
    readSaveOptions(root) {
      const v = id => root.querySelector(id);
      return {toSurvey: !!(v("#kk-tosurvey") && v("#kk-tosurvey").checked), band: v("#kk-band") ? v("#kk-band").value : "",
              consent: !!(v("#kk-consent") && v("#kk-consent").checked)};
    },
    hostNote(exam) {
      return exam.kind === "workbook"
        ? "予想問題集は、点数集計に集まった点数（このサイトの利用者）と比べます。本番換算は、このサイトの人が過去問の本試を解いたときの位置から推定しています。記録は、この端末のブラウザに保存されます。"
        : exam.survey
          ? `「このサイトの利用者の中での偏差値」は、点数集計の「${esc(exam.survey.subject)}・${esc(exam.survey.book)}」から出しています。記録は、この端末のブラウザにだけ保存されます。`
          : "記録は、この端末のブラウザにだけ保存されます（ほかの端末からは見えません）。";
    },
  };
  const want = new URLSearchParams(location.search).get("exam");
  window.KAKOMON = window.Kakomon.mount(document.getElementById("kakomon"), {
    exams: window.KAKOMON_EXAMS, stages: window.KAKOMON_STAGES, host, initialExam: want || null,
  });
})();
</script>
</body>
</html>
